[config]
swatch_count = 16

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'
post_hook = 'niri msg action load-config-file'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'

[templates.vencord]
input_path = '~/.config/matugen/templates/midnight-discord.css'
output_path = '~/.config/Vencord/themes/midnight-discord.css'

[templates.sonora]
input_path = '~/.config/matugen/templates/sonora.json'
output_path = '~/.config/sonora/themes/matugen.json'

[templates.foot]
input_path = '~/.config/matugen/templates/foot-colors.ini'
output_path = '~/.cache/matugen/foot-colors.ini'

[templates.foot_live]
input_path = '~/.config/matugen/templates/foot-sequences'
output_path = '~/.cache/matugen/foot-sequences'
post_hook = '''
seq=$(sed 's/ESC/\x1b/g; s/BEL/\x07/g' ~/.cache/matugen/foot-sequences)
for tty in /dev/pts/[0-9]*; do
    if [ -w "$tty" ]; then
        printf "%s" "$seq" > "$tty"
    fi
done
'''
