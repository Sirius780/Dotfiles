[config]
swatch_count = 16

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'
post_hook = 'niri msg action load-config-file'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.local/share/themes/matugen/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3; gsettings set org.gnome.desktop.interface gtk-theme matugen'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface color-scheme "prefer-light"; sleep 0.1; gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'
post_hook = 'touch ~/.config/qt5ct/qt5ct.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'
post_hook = 'touch ~/.config/qt6ct/qt6ct.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'

[templates.vencord]
input_path = '~/.config/matugen/templates/midnight-discord.css'
output_path = '~/.config/Vencord/themes/midnight-discord.css'

[templates.sonora]
input_path = '~/.config/matugen/templates/sonora.json'
output_path = '~/.config/sonora/themes/matugen.json'

[templates.foot]
input_path = '~/.config/matugen/templates/foot-colors.ini'
output_path = '~/.cache/matugen/foot-colors.ini'

[templates.foot_live]
input_path = '~/.config/matugen/templates/foot-sequences'
output_path = '~/.cache/matugen/foot-sequences'
post_hook = '''
seq=$(sed 's/ESC/\x1b/g; s/BEL/\x07/g' ~/.cache/matugen/foot-sequences)
for tty in /dev/pts/[0-9]*; do
    if [ -w "$tty" ]; then
        printf "%s" "$seq" > "$tty"
    fi
done
'''
